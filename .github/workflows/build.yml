name: Build op-node debug (temporary)
run-name: op-node gossip debug · ${{ github.ref_name }}

# Temporary op-node variant of main's native builds and manifest merge.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1
  REGISTRY: 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com
  IMAGE: blockchain-op-node
  DOCKERFILE: ops/docker/op-stack-go/Dockerfile
  OP_NODE_VERSION: v1.19.3-gossip-debug
  # Preserve the deployed image's runtime environment, replacing only op-node.
  RUNTIME_BASE: 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com/blockchain-op-node@sha256:b77931934669533abe571fea284ec0783a103113bb63c11fc81a5eb4e78372d8

jobs:
  build-artifacts:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu2404-linux-x86-64-16c
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu2204-arm64-16c
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set env (determine image tag)
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "REVISION=${OP_NODE_VERSION}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "GIT_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '294354037686'

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registry-type: private
          registries: '294354037686'

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: ${{ env.DOCKERFILE }}
          context: .
          target: op-node-target
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.arch }}-${{ env.REVISION }}
          build-args: |
            TARGET_BASE_IMAGE=${{ env.RUNTIME_BASE }}
            OP_NODE_VERSION=${{ env.OP_NODE_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            GIT_DATE=${{ env.GIT_DATE }}
          cache-from: type=gha,scope=op-node-gossip-debug-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=op-node-gossip-debug-${{ matrix.arch }}
          provenance: false

      - name: Verify binary and diagnostic flag
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_ref="${REGISTRY}/${IMAGE}:${ARCH}-${REVISION}"
          docker pull --platform="$PLATFORM" "$image_ref"
          test "$(docker image inspect --format '{{.Architecture}}' "$image_ref")" = "$ARCH"
          version_output="$(docker run --rm "$image_ref" op-node --version)"
          echo "$version_output"
          [[ "$version_output" == *"$OP_NODE_VERSION"* ]]
          [[ "$version_output" == *"${SOURCE_SHA:0:8}"* ]]
          docker run --rm "$image_ref" op-node --help > "$RUNNER_TEMP/op-node-help.txt"
          grep -F -- '--p2p.gossip.debug' "$RUNNER_TEMP/op-node-help.txt"

  manifest:
    name: merge-manifest
    needs: build-artifacts
    runs-on: ubuntu2404-linux-x86-64-16c
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set env (determine image tag)
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "REVISION=${OP_NODE_VERSION}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '294354037686'

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registry-type: private
          registries: '294354037686'

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Merge and verify manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_ref="${REGISTRY}/${IMAGE}:${REVISION}"
          amd64_ref="${REGISTRY}/${IMAGE}:amd64-${REVISION}"
          arm64_ref="${REGISTRY}/${IMAGE}:arm64-${REVISION}"
          docker pull --platform=linux/amd64 "$amd64_ref"
          docker pull --platform=linux/arm64 "$arm64_ref"
          docker buildx imagetools create --tag "$image_ref" "$amd64_ref" "$arm64_ref"
          docker buildx imagetools inspect --raw "$image_ref" > "$RUNNER_TEMP/op-node-manifest.json"
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' "$RUNNER_TEMP/op-node-manifest.json"
          docker buildx imagetools inspect "$image_ref" > "$RUNNER_TEMP/op-node-manifest.txt"
          cat "$RUNNER_TEMP/op-node-manifest.txt"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' "$RUNNER_TEMP/op-node-manifest.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### op-node gossip debug image'
            echo "- Source commit: $SOURCE_SHA"
            echo '- Platforms: linux/amd64, linux/arm64'
            echo "- Image: $image_ref"
            echo "- Digest: $digest"
            echo '- Smoke check: version, source revision, and --p2p.gossip.debug passed on both architectures'
            echo '- Enable diagnostics at runtime with --p2p.gossip.debug'
          } >> "$GITHUB_STEP_SUMMARY"
          docker rmi "$amd64_ref" "$arm64_ref"
