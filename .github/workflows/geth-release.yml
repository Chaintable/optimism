name: l2geth release

on:
  release:
    types:
      - created
  workflow_dispatch:

defaults:
  run:
    working-directory: ./l2geth

env:
  REGISTRY: 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com
  IMAGE: op-l2geth
  DOCKERFILE: Dockerfile

jobs:
  release:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: [self-hosted, "${{ matrix.arch }}"]

    steps:
    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.17.x

    - name: Checkout code
      uses: actions/checkout@v2
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set env
      run: |
        echo "REVISION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

    - name: Docker build and push
      run: |
        docker build -t ${REGISTRY}/${IMAGE}:${{ matrix.arch }}-${REVISION} -f ${DOCKERFILE} ..
        docker push ${REGISTRY}/${IMAGE}:${{ matrix.arch }}-${REVISION}
        docker run --name dryrun --rm ${REGISTRY}/${IMAGE}:${{ matrix.arch }}-${REVISION} version
        docker rmi ${REGISTRY}/${IMAGE}:${{ matrix.arch }}-${REVISION}

    - name: Lark Notification
      continue-on-error: true
      run: |
        notiv3 "Blockchain Optimism latest image pushed 🎉" ${REGISTRY}/${IMAGE}:${{ matrix.arch }}-${REVISION}


  merge-docker-manifest:
    runs-on: [self-hosted, ops]
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set env
        run: |
          echo "REVISION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Merge manifest
        run: |
          docker pull --platform=linux/amd64 ${REGISTRY}/${IMAGE}:amd64-${REVISION}
          docker pull --platform=linux/arm64 ${REGISTRY}/${IMAGE}:arm64-${REVISION}
          docker buildx imagetools create --tag ${REGISTRY}/${IMAGE}:${REVISION} ${REGISTRY}/${IMAGE}:amd64-${REVISION} ${REGISTRY}/${IMAGE}:arm64-${REVISION}
