name: geth unit tests

on:
  push:
    branches:
      - 'debank'
  pull_request:
    branches:
      - 'debank'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./l2geth

jobs:
  lint:
    runs-on: [self-hosted, ops]

    steps:
    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.17.x

    - name: Checkout code
      uses: actions/checkout@v2
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Lint
      run: |
        make lint

  build:
    runs-on: [self-hosted, general]

    needs: lint

    steps:
    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.17.x

    - name: Checkout code
      uses: actions/checkout@v2
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Docker build and push
      run: |
        docker build -t 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com/op-l2geth:${GITHUB_SHA::8} -f Dockerfile ..
        docker push 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com/op-l2geth:${GITHUB_SHA::8}
        docker rmi 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com/op-l2geth:${GITHUB_SHA::8}
