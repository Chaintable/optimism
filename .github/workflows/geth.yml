name: geth unit tests

on:
  push:
    paths:
      - 'l2geth/**'
    branches:
      - 'debank'
  pull_request:
    paths:
      - 'l2geth/**'
    branches:
      - 'debank'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./l2geth

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.15.x

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Lint
      run: |
        git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}:x-oauth-basic@github.com/DeBankDeFi".insteadOf "https://github.com/DeBankDeFi"
        make lint

  build:
    runs-on: ubuntu-latest

    needs: lint

    steps:
    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.15.x

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Make binary
      run: |
        git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}:x-oauth-basic@github.com/DeBankDeFi".insteadOf "https://github.com/DeBankDeFi"
        make geth

    - uses: azure/docker-login@v1
      with:
        login-server: debank-prod-registry.cn-hangzhou.cr.aliyuncs.com
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Docker build and push
      run: |
        docker build -t debank-prod-registry.cn-hangzhou.cr.aliyuncs.com/infra/op-l2geth:${GITHUB_SHA::8} -f ../ops/docker/Dockerfile.geth ..
        docker push debank-prod-registry.cn-hangzhou.cr.aliyuncs.com/infra/op-l2geth:${GITHUB_SHA::8}
