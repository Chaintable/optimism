name: Temporary op-node debug image

on:
  workflow_call:
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  REGISTRY: 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com
  IMAGE: blockchain-op-node
  OP_NODE_VERSION: v1.19.3-gossip-debug
  # Preserve the deployed image's runtime environment, replacing only op-node.
  RUNTIME_BASE: 294354037686.dkr.ecr.ap-northeast-1.amazonaws.com/blockchain-op-node@sha256:b77931934669533abe571fea284ec0783a103113bb63c11fc81a5eb4e78372d8

jobs:
  build:
    name: build-amd64
    runs-on: ubuntu2404-linux-x86-64-16c
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare source and image metadata
        id: metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git submodule update --init --depth 1 -- superchain-registry
          image_ref="${REGISTRY}/${IMAGE}:${OP_NODE_VERSION}-${SOURCE_SHA:0:12}"
          {
            echo "image_ref=$image_ref"
            echo "git_date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Source commit: $SOURCE_SHA"
          echo "Image: $image_ref"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '294354037686'

      - name: Login to private Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registry-type: private
          registries: '294354037686'
          mask-password: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build debug image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ops/docker/op-stack-go/Dockerfile
          target: op-node-target
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.image_ref }}
          build-args: |
            TARGET_BASE_IMAGE=${{ env.RUNTIME_BASE }}
            OP_NODE_VERSION=${{ env.OP_NODE_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            GIT_DATE=${{ steps.metadata.outputs.git_date }}
          cache-from: type=gha,scope=op-node-gossip-debug-amd64
          cache-to: type=gha,mode=max,scope=op-node-gossip-debug-amd64
          provenance: false

      - name: Verify binary and diagnostic flag
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE_REF")" = amd64
          version_output="$(docker run --rm "$IMAGE_REF" op-node --version)"
          echo "$version_output"
          [[ "$version_output" == *"$OP_NODE_VERSION"* ]]
          [[ "$version_output" == *"${SOURCE_SHA:0:8}"* ]]
          docker run --rm "$IMAGE_REF" op-node --help > "$RUNNER_TEMP/op-node-help.txt"
          grep -F -- '--p2p.gossip.debug' "$RUNNER_TEMP/op-node-help.txt"

      - name: Push verified image and inspect published manifest
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"
          docker buildx imagetools inspect "$IMAGE_REF" > "$RUNNER_TEMP/op-node-manifest.txt"
          cat "$RUNNER_TEMP/op-node-manifest.txt"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' "$RUNNER_TEMP/op-node-manifest.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### op-node gossip debug image'
            echo "- Source commit: $SOURCE_SHA"
            echo '- Platform: linux/amd64'
            echo "- Image: $IMAGE_REF"
            echo "- Digest: $digest"
            echo '- Smoke check: version, source revision, and --p2p.gossip.debug passed'
            echo '- Enable diagnostics at runtime with --p2p.gossip.debug'
          } >> "$GITHUB_STEP_SUMMARY"
